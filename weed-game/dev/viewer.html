<!doctype html><html><body style="margin:0;background:#888"><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
const q = new URLSearchParams(location.search); const m = q.get('m') || 'weed';
const view = q.get('v') || 'side';
const r = new THREE.WebGLRenderer({ canvas: c, antialias: true, preserveDrawingBuffer: true }); r.setSize(800, 400);
const s = new THREE.Scene(); s.background = new THREE.Color(0x888888);
s.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2)); const dl = new THREE.DirectionalLight(0xffffff, 2); dl.position.set(1, 2, 3); s.add(dl);
s.add(new THREE.AxesHelper(0.6)); s.add(new THREE.GridHelper(2, 20));
const cam = new THREE.OrthographicCamera(-1, 1, 0.5, -0.5, 0.01, 10);
if (view === 'side') cam.position.set(0, 0.4, 3); else if (view === 'top') { cam.position.set(0, 3, 0); cam.up.set(0, 0, -1); } else cam.position.set(3, 0.4, 0);
cam.lookAt(0, view === 'top' ? 0 : 0.4, 0);
const g = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('../public/models/' + m + '.glb');
s.add(g.scene);
const cols = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xff8800, 0x8800ff, 0x00ff88, 0xffffff, 0x000000, 0x884400, 0x448800];
if (m === 'dog_parts') g.scene.traverse(o => { if (o.isMesh) { const i = +o.name.replace(/\D/g, '') || 0; o.material = new THREE.MeshLambertMaterial({ color: cols[i % 13] }); } });
r.render(s, cam); window.done = true;
</script></body></html>
